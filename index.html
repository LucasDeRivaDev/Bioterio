<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ITeRatE" />
    <meta name="description" content="Sistema de gestión de colonias de ratones de laboratorio" />
    <title>ITeRatE — Colony Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script>
      try {
        if (localStorage.getItem('appMosca_brillo') === 'true') document.documentElement.classList.add('modo-claro')
      } catch (e) {}
    </script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['IBM Plex Sans', 'system-ui', 'sans-serif'],
              // Datos y etiquetas: condensada con números tabulares (ver index.css), no monospace
              mono: ['IBM Plex Sans Condensed', 'IBM Plex Sans', 'system-ui', 'sans-serif'],
              cond: ['IBM Plex Sans Condensed', 'IBM Plex Sans', 'system-ui', 'sans-serif'],
              code: ['IBM Plex Mono', 'monospace'],
            },
            borderColor: {
              DEFAULT: 'var(--line)',
            },
            borderRadius: {
              xl: '0.625rem',
              '2xl': '0.75rem',
              '3xl': '1rem',
            },
            colors: {
              lab: {
                950: 'var(--canvas)',
                900: 'var(--surface)',
                800: 'var(--raised)',
                700: '#111d35',
                600: '#172444',
                500: '#1e2f55',
                border: 'var(--line)',
                muted: 'var(--ink-faint)',
              },
              canvas: 'var(--canvas)',
              surface: 'var(--surface)',
              raised: 'var(--raised)',
              sunken: 'var(--sunken)',
              line: { DEFAULT: 'var(--line)', soft: 'var(--line-soft)' },
              focus: 'var(--focus)',
              ok: 'var(--ok)',
              danger: 'var(--danger)',
              ink: { DEFAULT: 'var(--ink)', soft: 'var(--ink-soft)', faint: 'var(--ink-faint)' },
              neon: {
                green: '#00e676',
                greenDim: '#00c85a',
                greenGlow: 'rgba(0,230,118,0.15)',
                amber: '#ffb300',
                red: '#ff3d57',
                blue: '#40c4ff',
                purple: '#ce93d8',
              },
              rat: {
                brown: '#a17850',
                gray: '#8a9bb0',
                light: 'var(--ink)',
              }
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-lab-950 text-rat-light antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
