    <!-- Splash (apertura de la app): HTML y CSS puros para que aparezca en el
         primer instante, mientras cargan la app y los datos del dispositivo.
         Se va cuando la app avisa "app:ready" (main.jsx) y pasó la animación. -->
    <style>
      #splash {
        --brand: #00f0d0;
        --brand-soft: rgba(0, 240, 208, 0.28);
        position: fixed;
        inset: 0;
        z-index: 10000; /* por encima del botón de tema y del aviso de actualización (9999) */
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(120% 90% at 50% 42%, #0f1d3a 0%, #0a1224 45%, #060a15 100%);
        color: #8a9bb0;
        font-family: 'IBM Plex Sans Condensed', 'IBM Plex Sans', system-ui, sans-serif;
        cursor: default;
        transition: opacity 0.6s ease, transform 0.7s cubic-bezier(0.4, 0, 0.2, 1), filter 0.6s ease;
      }
      #splash.out { opacity: 0; transform: scale(1.06); filter: blur(8px); pointer-events: none; }
      #splash.quick.out { transition-duration: 0.25s; transform: none; filter: none; }
      #splash .sp-circuits { position: absolute; inset: 0; width: 100%; height: 100%; }
      #splash .sp-trace { fill: none; stroke: var(--brand-soft); stroke-width: 1.4; stroke-dasharray: 1; stroke-dashoffset: 1; animation: sp-draw 1.8s cubic-bezier(0.6, 0, 0.2, 1) forwards; }
      #splash .sp-packet { fill: none; stroke: var(--brand); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 0.05 1; stroke-dashoffset: 1.05; opacity: 0; animation: sp-packet 2.4s cubic-bezier(0.5, 0, 0.3, 1) infinite; filter: drop-shadow(0 0 3px rgba(0, 240, 208, 0.9)); }
      #splash .sp-node { fill: #0a1224; stroke: var(--brand); stroke-width: 1.4; opacity: 0; animation: sp-fade 0.4s ease forwards; }
      #splash .sp-vignette { position: absolute; inset: 0; background: radial-gradient(60% 55% at 50% 45%, transparent 40%, rgba(4, 7, 15, 0.85) 100%); pointer-events: none; }
      #splash .sp-stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 24px; }
      #splash .sp-dish { position: relative; width: 176px; height: 188px; animation: sp-float 4.2s ease-in-out 3.4s infinite; }
      #splash .sp-dish img { width: 100%; height: 100%; opacity: 0; transform: scale(0.82) rotate(-6deg); filter: blur(14px); animation: sp-dish 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) 1.4s forwards; }
      #splash .sp-ring { position: absolute; left: 70%; top: 24%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 1.5px solid var(--brand); opacity: 0; transform: scale(0.15); animation: sp-ring 3.2s cubic-bezier(0.2, 0.6, 0.3, 1) infinite; }
      /* Signal waves start once the dish is in place. */
      #splash .sp-ring:nth-child(1) { animation-delay: 3s; }
      #splash .sp-ring:nth-child(2) { animation-delay: 3.8s; }
      #splash .sp-ring:nth-child(3) { animation-delay: 4.6s; }
      #splash .sp-ring:nth-child(4) { animation-delay: 5.4s; }
      #splash .sp-word { position: relative; width: min(420px, 78vw); aspect-ratio: 900 / 250; }
      #splash .sp-word img { width: 100%; height: 100%; clip-path: inset(0 100% 0 0); animation: sp-wipe 1.6s cubic-bezier(0.7, 0, 0.2, 1) 4.4s forwards, sp-glow 3.2s ease-in-out 6.4s infinite; }
      #splash .sp-edge { position: absolute; top: -6%; bottom: -6%; left: 0; width: 3px; border-radius: 3px; background: linear-gradient(180deg, transparent, #b8fff2 30%, #fff 50%, #b8fff2 70%, transparent); box-shadow: 0 0 18px 4px rgba(0, 240, 208, 0.65); opacity: 0; animation: sp-edge 1.6s cubic-bezier(0.7, 0, 0.2, 1) 4.4s forwards; }
      #splash .sp-scan { position: absolute; left: -10%; right: -10%; top: 0; height: 70px; background: linear-gradient(180deg, transparent, rgba(0, 240, 208, 0.16) 45%, rgba(184, 255, 242, 0.45) 50%, rgba(0, 240, 208, 0.16) 55%, transparent); mix-blend-mode: screen; opacity: 0; animation: sp-scan 1.8s cubic-bezier(0.45, 0, 0.25, 1) 3.4s, sp-scan 2s cubic-bezier(0.45, 0, 0.25, 1) 7.8s; pointer-events: none; }
      #splash .sp-caption { margin: 2px 0 0; color: #a9b8c9; font-size: 13px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; text-align: center; opacity: 0; transform: translateY(8px); animation: sp-rise 0.9s ease 6.2s forwards; }
      #splash .sp-caption b { color: #eaf2f8; font-weight: 600; }
      #splash .sp-bar { position: absolute; bottom: max(48px, 7vh); left: 50%; width: 160px; height: 2px; margin-left: -80px; border-radius: 2px; background: rgba(138, 155, 176, 0.18); overflow: hidden; opacity: 0; animation: sp-fade 0.4s ease 0.3s forwards; }
      #splash .sp-bar i { display: block; height: 100%; width: 100%; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, rgba(0, 240, 208, 0.4), var(--brand)); animation: sp-load 9.6s cubic-bezier(0.4, 0, 0.3, 1) 0.3s forwards; }
      /* Sound control: a small round icon button, no words. on = equalizer
         bars; armed (waiting for the first touch) = speaker with a pulse;
         off = speaker crossed out. The label goes to screen readers and a tooltip. */
      #splash .sp-sound { position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); right: max(18px, env(safe-area-inset-right, 0px)); width: 40px; height: 40px; padding: 0; display: grid; place-items: center; border-radius: 50%; border: 1px solid rgba(0, 240, 208, 0.3); background: rgba(10, 18, 36, 0.55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #cfeee8; cursor: pointer; opacity: 0; animation: sp-fade 0.5s ease 0.6s forwards; transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease, transform 0.15s ease; -webkit-tap-highlight-color: transparent; }
      #splash .sp-sound::before { content: ''; position: absolute; inset: -10px; border-radius: 50%; }
      #splash .sp-sound:hover { border-color: var(--brand); background: rgba(0, 240, 208, 0.1); color: #fff; }
      #splash .sp-sound:active { transform: scale(0.92); }
      #splash .sp-sound:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
      #splash .sp-sound svg { width: 18px; height: 18px; display: none; }
      #splash .sp-sound[data-state='on'] .sp-ico-on, #splash .sp-sound[data-state='armed'] .sp-ico-armed, #splash .sp-sound[data-state='off'] .sp-ico-off { display: block; }
      #splash .sp-sound[data-state='off'] { color: #8a9bb0; border-color: rgba(138, 155, 176, 0.3); }
      #splash .sp-sound[data-state='armed']::after { content: ''; position: absolute; inset: -1px; border-radius: 50%; border: 1.5px solid var(--brand); animation: sp-pulse 1.6s ease-out infinite; pointer-events: none; }
      #splash .sp-eq rect { fill: currentColor; transform-box: fill-box; transform-origin: 50% 100%; animation: sp-eq 0.9s ease-in-out infinite alternate; }
      #splash .sp-eq rect:nth-child(2) { animation-duration: 0.7s; animation-delay: -0.3s; }
      #splash .sp-eq rect:nth-child(3) { animation-duration: 1.1s; animation-delay: -0.5s; }
      #splash .sp-eq rect:nth-child(4) { animation-duration: 0.8s; animation-delay: -0.2s; }
      #splash .sp-tip { position: absolute; top: calc(100% + 8px); right: 0; padding: 4px 9px; border-radius: 6px; background: rgba(10, 18, 36, 0.92); border: 1px solid rgba(138, 155, 176, 0.25); color: #d6dee8; font: 500 12px 'IBM Plex Sans Condensed', system-ui, sans-serif; white-space: nowrap; opacity: 0; transform: translateY(-3px); transition: opacity 0.15s ease, transform 0.15s ease; pointer-events: none; }
      #splash .sp-sound:hover .sp-tip, #splash .sp-sound:focus-visible .sp-tip { opacity: 1; transform: none; }
      @keyframes sp-pulse { from { transform: scale(1); opacity: 0.7; } to { transform: scale(1.75); opacity: 0; } }
      @keyframes sp-eq { from { transform: scaleY(0.25); } to { transform: scaleY(1); } }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-packet { 0% { stroke-dashoffset: 1.05; opacity: 0; } 12% { opacity: 1; } 85% { opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
      @keyframes sp-fade { to { opacity: 1; } }
      @keyframes sp-dish { 60% { filter: blur(0); } to { opacity: 1; transform: none; filter: drop-shadow(0 0 22px rgba(0, 240, 208, 0.25)); } }
      @keyframes sp-ring { 0% { opacity: 0; transform: scale(0.15); } 15% { opacity: 0.55; } 100% { opacity: 0; transform: scale(2.6); } }
      @keyframes sp-wipe { to { clip-path: inset(0 0 0 0); } }
      @keyframes sp-edge { 0% { left: 0; opacity: 0; } 10% { opacity: 1; } 88% { opacity: 1; } 100% { left: 100%; opacity: 0; } }
      @keyframes sp-scan { 0% { top: -20%; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { top: 105%; opacity: 0; } }
      @keyframes sp-rise { to { opacity: 1; transform: none; } }
      @keyframes sp-load { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
      @keyframes sp-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes sp-glow { 0%, 100% { filter: drop-shadow(0 0 0 rgba(0, 240, 208, 0)); } 50% { filter: drop-shadow(0 0 14px rgba(0, 240, 208, 0.45)); } }
      /* Less motion (system setting): the logo, still, until the app is ready. */
      #splash.quick *, #splash.quick *::before { animation: none !important; }
      #splash.quick .sp-dish img, #splash.quick .sp-word img, #splash.quick .sp-caption, #splash.quick .sp-bar { opacity: 1; transform: none; filter: none; clip-path: none; }
      #splash.quick .sp-ring, #splash.quick .sp-edge, #splash.quick .sp-scan, #splash.quick .sp-packet { display: none; }
      #splash.quick .sp-trace { stroke-dashoffset: 0; }
      #splash.quick .sp-node { opacity: 1; }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::before { animation: none !important; }
        #splash .sp-dish img, #splash .sp-word img, #splash .sp-caption, #splash .sp-bar { opacity: 1; transform: none; filter: none; clip-path: none; }
        #splash .sp-ring, #splash .sp-edge, #splash .sp-scan, #splash .sp-packet { display: none; }
        #splash .sp-trace { stroke-dashoffset: 0; }
        #splash .sp-node { opacity: 1; }
        #splash.out { transform: none; filter: none; }
      }
      @media (max-height: 520px) { #splash .sp-dish { width: 120px; height: 128px; } #splash .sp-stage { gap: 14px; } }
      @media print { #splash { display: none; } }
    </style>

    <script>
      // The splash plays on every open and reload (como en ITeRatE ICIVET; pedido de Lucas, 23/11/2026):
      // about 10 s, then the app.
      // It leaves when the app is ready (main.jsx: "app:ready") and the time
      // passed; a tap skips it. With "reduce motion": still logo, short.
      // Safety net: never longer than 13 s.
      // Lab soundscape for the splash, synthesized with Web Audio (no files),
      // in step with the animation: rack and ventilation hum, data clicks
      // while the circuits draw, telemetry blips, the dish rising, a sonar
      // ping per signal wave, the scan airflow, a chord when the logo is
      // complete and the "instrument ready" double beep. Sound is on by default
      // (como en ITeRatE ICIVET; pedido de Lucas, 23/11/2026). Browsers only let a page play sound after
      // a touch (installed apps and sites used with sound usually can): when it
      // is blocked, the first touch anywhere starts it from where the animation
      // is, without skipping it. Muting is remembered on the device
      // (isal.splash.sound = 'off').
      function splashSound(el, startedAt) {
        var AC = window.AudioContext || window.webkitAudioContext
        var btn = el.querySelector('.sp-sound')
        if (!AC || !btn) return null
        var pref = null
        try { pref = localStorage.getItem('isal.splash.sound') } catch (e) {}
        var ctx = null
        var master = null
        var playing = false
        var tookTap = false
        var TIPS = { on: 'Silenciar', armed: 'Tocá la pantalla para escuchar', off: 'Activar sonido' }
        function setState(state) {
          btn.hidden = false
          btn.dataset.state = state
          btn.setAttribute('aria-pressed', state === 'on' ? 'true' : 'false')
          btn.setAttribute('aria-label', TIPS[state])
          btn.querySelector('.sp-tip').textContent = TIPS[state]
        }
        function noiseBuffer() {
          var b = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate)
          var d = b.getChannelData(0)
          for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1
          return b
        }
        function env(g, t, peak, attack, decay) {
          g.gain.setValueAtTime(0.0001, t)
          g.gain.exponentialRampToValueAtTime(peak, t + attack)
          g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay)
        }
        function tone(t, freq, type, peak, attack, decay, dest, glideTo) {
          var o = ctx.createOscillator()
          var g = ctx.createGain()
          o.type = type
          o.frequency.setValueAtTime(freq, t)
          if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + attack + decay)
          env(g, t, peak, attack, decay)
          o.connect(g).connect(dest || master)
          o.start(t)
          o.stop(t + attack + decay + 0.05)
        }
        function noise(t, dur, peak, type, f0, f1, q) {
          var src = ctx.createBufferSource()
          src.buffer = noiseBuffer()
          var f = ctx.createBiquadFilter()
          f.type = type
          f.Q.value = q || 0.8
          f.frequency.setValueAtTime(f0, t)
          if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur)
          var g = ctx.createGain()
          g.gain.setValueAtTime(0.0001, t)
          g.gain.exponentialRampToValueAtTime(peak, t + dur * 0.35)
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur)
          src.connect(f).connect(g).connect(master)
          src.start(t)
          src.stop(t + dur + 0.05)
        }
        function play() {
          if (playing) return
          playing = true
          var at = (Date.now() - startedAt) / 1000
          var now = ctx.currentTime
          var t0 = now - at
          var T = function (s) { return t0 + s }
          var end = T(10)
          master = ctx.createGain()
          master.gain.value = 0.9
          var comp = ctx.createDynamicsCompressor()
          master.connect(comp).connect(ctx.destination)
          // Echo for the sonar pings.
          var echo = ctx.createDelay(1)
          echo.delayTime.value = 0.32
          var fb = ctx.createGain()
          fb.gain.value = 0.38
          var wet = ctx.createGain()
          wet.gain.value = 0.5
          echo.connect(fb).connect(echo)
          echo.connect(wet).connect(master)
          // Rack and ventilation hum, the whole time.
          var hum = ctx.createGain()
          hum.gain.setValueAtTime(0.0001, now)
          hum.gain.exponentialRampToValueAtTime(0.09, Math.max(now + 0.4, T(1.6)))
          hum.gain.setValueAtTime(0.09, Math.max(now + 0.5, T(8.8)))
          hum.gain.exponentialRampToValueAtTime(0.0001, end)
          var lp = ctx.createBiquadFilter()
          lp.type = 'lowpass'
          lp.frequency.value = 220
          hum.connect(master)
          lp.connect(hum)
          ;[[50, 'sawtooth', 0.5], [100.4, 'sine', 0.7], [150, 'sine', 0.25]].forEach(function (h) {
            var o = ctx.createOscillator()
            var g = ctx.createGain()
            o.type = h[1]
            o.frequency.value = h[0]
            g.gain.value = h[2]
            o.connect(g).connect(lp)
            o.start(now)
            o.stop(end + 0.1)
          })
          var air = ctx.createBufferSource()
          air.buffer = noiseBuffer()
          air.loop = true
          var bp = ctx.createBiquadFilter()
          bp.type = 'bandpass'
          bp.frequency.value = 700
          bp.Q.value = 0.6
          var ag = ctx.createGain()
          ag.gain.setValueAtTime(0.0001, now)
          ag.gain.exponentialRampToValueAtTime(0.022, Math.max(now + 0.4, T(2)))
          ag.gain.setValueAtTime(0.022, Math.max(now + 0.5, T(8.8)))
          ag.gain.exponentialRampToValueAtTime(0.0001, end)
          air.connect(bp).connect(ag).connect(master)
          air.start(now)
          air.stop(end + 0.1)
          var events = []
          // Data clicks while the circuits draw.
          for (var c = 0.25; c < 2.5; c += 0.09 + ((c * 7919) % 1) * 0.08) events.push([c, function (t) { noise(t, 0.025, 0.05, 'highpass', 3500, null, 1) }])
          // Telemetry blips, one per light packet.
          for (var k = 0; k < 18; k++) (function (k) { events.push([2.4 + k * 0.4, function (t) { tone(t, 1800 + (k % 4) * 220, 'sine', 0.035, 0.005, 0.07) }]) })(k)
          // The dish rises.
          events.push([1.4, function (t) { tone(t, 180, 'triangle', 0.12, 0.6, 1.3, null, 640); tone(t + 0.05, 360, 'sine', 0.05, 0.6, 1.2, null, 1280) }])
          // Sonar ping per signal wave.
          ;[3, 3.8, 4.6, 5.4, 6.2, 7, 7.8, 8.6].forEach(function (s, i) {
            events.push([s, function (t) { tone(t, i % 2 ? 1174.7 : 1046.5, 'sine', 0.13, 0.008, 1.1, echo); tone(t, i % 2 ? 1174.7 : 1046.5, 'sine', 0.09, 0.008, 0.9) }])
          })
          // The scan passes (twice).
          events.push([3.4, function (t) { noise(t, 1.8, 0.05, 'bandpass', 400, 4200, 1.2) }])
          events.push([7.8, function (t) { noise(t, 2, 0.04, 'bandpass', 400, 4200, 1.2) }])
          // The logo reveals with a shimmer, then a chord when it is complete.
          events.push([4.4, function (t) { tone(t, 660, 'sine', 0.03, 1.4, 0.3, null, 1980) }])
          events.push([6, function (t) { [523.25, 659.25, 783.99, 987.77].forEach(function (f, i) { tone(t + i * 0.05, f, 'sine', 0.07, 0.02, 2.6) }) }])
          // "Instrument ready": double beep as the bar completes.
          events.push([9.2, function (t) { tone(t, 1318.5, 'square', 0.03, 0.004, 0.09) }])
          events.push([9.42, function (t) { tone(t, 1318.5, 'square', 0.03, 0.004, 0.12) }])
          events.forEach(function (e) { if (e[0] >= at) e[1](T(e[0])) })
        }
        function begin() {
          if (!ctx) ctx = new AC()
          return ctx.resume().then(function () {
            if (ctx.state !== 'running') throw new Error('blocked')
            if (master) {
              // Muted earlier: the soundscape is still running, turn it up again.
              master.gain.setTargetAtTime(0.9, ctx.currentTime, 0.08)
              playing = true
            } else play()
            setState('on')
          })
        }
        // Blocked: the first touch or key anywhere starts the sound (those are
        // the events browsers accept as a gesture). That touch doesn't skip.
        var GESTURES = ['pointerup', 'touchend', 'mousedown', 'keydown']
        function arm() {
          setState('armed')
          GESTURES.forEach(function (type) { document.addEventListener(type, unlock, true) })
        }
        function unlock() {
          GESTURES.forEach(function (type) { document.removeEventListener(type, unlock, true) })
          tookTap = true
          setTimeout(function () { tookTap = false }, 800)
          begin().catch(function () {})
        }
        btn.addEventListener('click', function (e) {
          e.stopPropagation()
          if (tookTap) { tookTap = false; return }
          if (playing && master) {
            master.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.08)
            playing = false
            setState('off')
            try { localStorage.setItem('isal.splash.sound', 'off') } catch (err) {}
            return
          }
          try { localStorage.removeItem('isal.splash.sound') } catch (err) {}
          begin().catch(function () {})
        })
        if (pref === 'off') setState('off')
        else {
          // Blocked autoplay leaves resume() waiting instead of failing.
          var waiting = setTimeout(function () { if (!playing) arm() }, 500)
          begin().catch(function () { clearTimeout(waiting); arm() })
        }
        return {
          // The touch that started the sound: it doesn't skip the splash.
          tookTap: function () {
            var t = tookTap
            tookTap = false
            return t
          },
          stop: function () {
            GESTURES.forEach(function (type) { document.removeEventListener(type, unlock, true) })
            if (!ctx || !master) return
            master.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.15)
            setTimeout(function () { ctx.close() }, 900)
          },
        }
      }
      (function () {
        var el = document.getElementById('splash')
        var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
        if (reduced) el.classList.add('quick')
        var minTime = reduced ? 1500 : 10000
        var start = Date.now()
        var ready = false
        var gone = false
        var skip = false
        var sound = reduced ? null : splashSound(el, start)
        function leave() {
          if (gone) return
          gone = true
          if (sound) sound.stop()
          el.classList.add('out')
          setTimeout(function () { el.remove() }, 750)
        }
        function maybeLeave() {
          if (!ready) return
          el.classList.add('ready')
          setTimeout(leave, skip ? 0 : Math.max(0, minTime - (Date.now() - start)))
        }
        window.addEventListener('app:ready', function () { ready = true; maybeLeave() })
        if (window.__appReady) { ready = true; maybeLeave() }
        el.addEventListener('click', function () {
          if (sound && sound.tookTap()) return
          // Tapped before the app is ready: it leaves as soon as it is.
          if (ready) leave()
          else skip = true
        })
        setTimeout(leave, 13000)
      })()
    </script>
